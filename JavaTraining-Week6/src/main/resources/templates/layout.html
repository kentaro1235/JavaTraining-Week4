<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, title)">
<head>
  <meta charset="UTF-8" />
  <title th:text="${title} ?: 'Task App'">Task App</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    header { margin-bottom: 16px; }
    .msg { padding: 10px 12px; margin: 12px 0; border-radius: 6px; }
    .success { background: #e8f5e9; }
    .error { background: #ffebee; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    .actions form { display: inline; }
    .btn { display:inline-block; padding: 1px 4px; border:1px solid black; background: #fff; cursor: pointer; border-radius: 6px; text-decoration: none;
    appearance: none; -webkit-appearance: none; font:inherit; color:inherit;}
    .btn:hover{text-decoration: underline black;}
    .btn-danger { border-color: rgb(255, 85, 85); border-radius: 6px;}
    .field-error { color: rgb(255, 85, 85); font-size: 0.9em; }
    .btn-nml{padding: 1px 4px;  background: #fff; cursor: pointer; border-radius: 6px; border-color:black}
    
    
    
  </style>
</head>
<body>

<header>
  <h1><a th:href="@{/tasks}" style="text-decoration:none;color:inherit;">Task App</a></h1>
</header>

<div th:if="${success}" class="msg success" th:text="${success}"></div>
<div th:if="${error}" class="msg error" th:text="${error}"></div>

<main>
  <div th:replace="${content}"></div>
</main>

<footer style="margin-top:24px; color:#666;">
  <small>JavaTraining Week6</small>
</footer>

</body>
</html>
